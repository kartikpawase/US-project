    <path d="M15,20 L355,20 C365,20 370,28 370,38 L370,175 L0,175 L0,38 C0,28 5,20 15,20 Z" fill="#021947" stroke="#00867A" stroke-width="2.5"/>

    <text x="185" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#4ADE80" text-anchor="middle" letter-spacing="2">HIGH-VELOCITY RETAIL PACK</text>
    <text x="185" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HYDRATE ELITE™</text>
    <text x="185" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FED7AA" text-anchor="middle">DUAL-TIER COUNTERTOP DISPENSER</text>
    <text x="185" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#A7F3D0" text-anchor="middle">HIGH-CAPACITY 30 STICK GRAVITY FEED</text>

