    <text x="185" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" text-anchor="middle">HIGH-CAPACITY RETAIL COUNTERTOP DISPENSER</text>
