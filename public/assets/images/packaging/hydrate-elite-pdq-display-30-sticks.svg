    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="34" height="150" rx="3.5" fill="#0A6EFF" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="40" y="0" width="34" height="150" rx="3.5" fill="#FF8A00" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="80" y="0" width="34" height="150" rx="3.5" fill="#00867A" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="120" y="0" width="34" height="150" rx="3.5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="160" y="0" width="34" height="150" rx="3.5" fill="#0A6EFF" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="200" y="0" width="34" height="150" rx="3.5" fill="#FF8A00" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="240" y="0" width="34" height="150" rx="3.5" fill="#00867A" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="280" y="0" width="34" height="150" rx="3.5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.2"/>
