      <stop offset="0%" stop-color="#0B103A" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0B103A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B103A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pdq30TrayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005A52"/>
      <stop offset="40%" stop-color="#021947"/>
      <stop offset="100%" stop-color="#010E28"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF"/>
  <ellipse cx="250" cy="465" rx="205" ry="22" fill="url(#pdqShadow5)"/>

  <!-- Wide Dual-Tier PDQ Group -->
  <g transform="translate(65, 30)">
