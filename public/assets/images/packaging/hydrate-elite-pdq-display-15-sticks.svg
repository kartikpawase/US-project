<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="pdqShadow4" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0B103A" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0B103A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B103A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pdqTrayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042366"/>
      <stop offset="100%" stop-color="#021438"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF"/>
  <ellipse cx="250" cy="460" rx="180" ry="20" fill="url(#pdqShadow4)"/>

  <g transform="translate(100, 35)">
    <!-- Upright Pop-Up Header Card -->
    <path d="M15,20 L285,20 C295,20 300,28 300,38 L300,165 L0,165 L0,38 C0,28 5,20 15,20 Z" fill="#021947" stroke="#0A6EFF" stroke-width="2"/>

    <!-- Header Branding -->
    <text x="150" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">RETAIL COUNTER DISPLAY CADDY</text>
    <text x="150" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HYDRATE ELITE™</text>
    <text x="150" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FED7AA" text-anchor="middle">FAST CELLULAR HYDRATION</text>
    <text x="150" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E0F2FE" text-anchor="middle">TAKE ONE ON THE GO · 15 PACKS</text>

    <!-- Standing Stick Packs in Tray -->
    <g transform="translate(30, 135)">
      <rect x="0" y="0" width="38" height="145" rx="3.5" fill="#0A6EFF" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="48" y="0" width="38" height="145" rx="3.5" fill="#FF8A00" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="96" y="0" width="38" height="145" rx="3.5" fill="#00867A" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="144" y="0" width="38" height="145" rx="3.5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="192" y="0" width="38" height="145" rx="3.5" fill="#0A6EFF" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <!-- Angled Side Tray Walls & Front Lip -->
    <path d="M-8,240 L308,240 L295,410 L5,410 Z" fill="url(#pdqTrayGrad)" stroke="#1E3A8A" stroke-width="2"/>

    <!-- Front Badge Presentation -->
    <rect x="25" y="275" width="250" height="95" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="150" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">15 STICK CARTON</text>
    <text x="150" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">PDQ DISPLAY CARTON</text>
    <text x="150" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">RETAIL-READY COUNTERTOP DISPENSER</text>
